[package]
name = "bolt-license-verify"
version = "0.1.0"
edition = "2021"
description = "Checks Bolt license tokens: RS256 signature, issuer, expiry grace, and seat cap. Verification only, it cannot issue a license."
authors = ["Sparcle <team@sparcle.app>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SparcleHQ/bolt-license-verify"
readme = "README.md"
keywords = ["license", "jwt", "verification", "bolt"]
categories = ["authentication"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "bolt_license_verify"
path = "src/lib.rs"

[dependencies]
jsonwebtoken = "9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Tests sign throwaway tokens with a keypair generated in memory at test time.
# No key is stored in this repository.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
